services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs-example

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-nestjs_example}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nestjs_example}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nestjs-example

networks:
  nestjs-example:
    driver: bridge

volumes:
  pgdata:
